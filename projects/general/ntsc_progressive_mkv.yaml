project:
  name: NTSCProgressiveMkvFixture
  version: "1.0"
  description: NTSC progressive MKV fixture

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED

output:
  video_path: "{output}/videosynth_ntsc_progressive_mkv.cvbs"

sections:
  - name: NtscMkvMovingZone
    type: progressive
    source: "{bundled}/mkv/720x486/MOVING_ZONE_2H.mkv"
    duration_frames: all
  - name: NtscMkvSmpteBars
    type: progressive
    source: "{bundled}/mkv/720x486/SMPTE_BARS_001.mkv"
    duration_frames: all
  - name: NtscMkvMovingBars
    type: progressive
    source: "{bundled}/mkv/720x486/MOVING_BARS_75.mkv"
    duration_frames: all