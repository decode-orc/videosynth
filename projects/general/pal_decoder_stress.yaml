project:
  name: PALDecoderStressFixture
  version: "1.0"
  description: >-
    PAL decoder-stress card with line-alternating +/-(R-Y) and +/-(B-Y) bars,
    and static luma and chroma zone plates, all band-limited and written with
    their picture truth

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_TPG21_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED

output:
  video_path: "{output}/videosynth_pal_decoder_stress.cvbs"
  truth: true

sections:
  - name: PalStress
    type: progressive
    source: "{bundled}/exr/720x576/PAL_STRESS.exr"
    duration_frames: 8
    horizontal_resample: bandlimited
    chroma_line_sign:
      # Left bar: unswitched V carrier, so V alternates line by line after the
      # decoder's V-switch.
      - region: {x: 48, y: 96, width: 96, height: 144}
        v: follow_switch
      # Right bar: U alternates with the V-switch (anti-PAL).
      - region: {x: 576, y: 96, width: 96, height: 144}
        u: follow_switch
  - name: PalLumaZonePlate
    type: progressive
    source: "{bundled}/exr/720x576/LUMA_ZONE_PLATE.exr"
    duration_frames: 4
    horizontal_resample: bandlimited
  - name: PalChromaZonePlate
    type: progressive
    source: "{bundled}/exr/720x576/CHROMA_ZONE_PLATE.exr"
    duration_frames: 4
    horizontal_resample: bandlimited
