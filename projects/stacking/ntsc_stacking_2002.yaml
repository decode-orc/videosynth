    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 28.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 14
        seed: 2002
      scratch:
        scale: 14
        seed: 2002
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 57
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
  # ---------------------------------------------------------------------------
  # Section 9: barely watchable
  # ---------------------------------------------------------------------------
  - name: BarelyWatchable
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 24.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 17
        seed: 2002
      scratch:
        scale: 17
        seed: 2002
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 65
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
  # ---------------------------------------------------------------------------
  # Section 10: sync-borderline — maximum noise and dropout
  # ---------------------------------------------------------------------------
  - name: SyncBorderline
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 20.0
      noise_spread_db: 0.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 20
        seed: 2002
      scratch:
        scale: 20
        seed: 2002
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 73
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag