# NTSC Stacking Test — Seed 2002
#
# 10 sections × 8 frames of tartan, progressing from clean (no degradation)
# to maximum noise and dropout. Designed for stacking algorithm validation.
#
# Noise ramp (noise_db): none → 58 → 53 → 48 → 43 → 38 → 33 → 28 → 24 → 20
# Dropout ramp (scale):  none →  2 →  4 →  6 →  8 → 10 → 12 → 14 → 17 → 20
# Picture numbers:          1 →  9 → 17 → 25 → 33 → 41 → 49 → 57 → 65 → 73
#
# All noise and dropout sections use seed 2002 as the deterministic base.
# Combine with ntsc_stacking_2002, ntsc_stacking_3003, ntsc_stacking_4004 to
# produce four independent captures with different degradation patterns.
#
# VITS: VIRS on lines 19 and 282 (IEC 60857 §9.1.3).
# FM codes: fm_picture_number and fm_white_flag per IEC 60857 §10.1.
# VBI burst: colour burst on the equalizing and broad sync pulses (IEC 60857 §9.1.2).

project:
  name: NtscStacking2002
  version: "1.0"
  description: NTSC stacking test — clean to max noise+dropout, seed 2002

cvbs_presets:
  video_standard_preset: NTSC
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED
  ntsc_laserdisc_vbi_burst: true

output:
  video_path: "{output}/videosynth_ntsc_stacking_2002.cvbs"

line_injections:
  disc_type: CAV
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:

  # ---------------------------------------------------------------------------
  # Section 1: clean reference — no noise, no dropout
  # ---------------------------------------------------------------------------
  - name: CleanSource
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 1
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
  # ---------------------------------------------------------------------------
  # Section 2: near-quantisation noise, minimal dropout
  # ---------------------------------------------------------------------------
  - name: NearQuantisation
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 58.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 2
        seed: 2002
      scratch:
        scale: 2
        seed: 2002
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
  # ---------------------------------------------------------------------------
  # Section 3: excellent source quality
  # ---------------------------------------------------------------------------
  - name: ExcellentSource
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 53.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 4
        seed: 2002
      scratch:
        scale: 4
        seed: 2002
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
  # ---------------------------------------------------------------------------
  # Section 4: good source quality
  # ---------------------------------------------------------------------------
  - name: GoodSource
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 48.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 6
        seed: 2002
      scratch:
        scale: 6
        seed: 2002
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 25
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
  # ---------------------------------------------------------------------------
  # Section 5: fair source quality
  # ---------------------------------------------------------------------------
  - name: FairSource
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 8
        seed: 2002
      scratch:
        scale: 8
        seed: 2002
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 33
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
  # ---------------------------------------------------------------------------
  # Section 6: typical VHS quality
  # ---------------------------------------------------------------------------
  - name: TypicalVhs
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 38.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 10
        seed: 2002
      scratch:
        scale: 10
        seed: 2002
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 41
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
  # ---------------------------------------------------------------------------
  # Section 7: poor tape
  # ---------------------------------------------------------------------------
  - name: PoorTape
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 12
        seed: 2002
      scratch:
        scale: 12
        seed: 2002
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 49
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
