# PAL-M Disc Simulation — Source B (seed 2002)
#
# Simulates a capture starting at PN 5 (PNs 1–4 not captured).
# Includes a forward skip: after PN 20 the player jumps to PN 23.
# PNs 21 and 22 are absent; Frame Map must detect the gap and pad.
# No backward skip.  34 frames total.
#
# Content layout (matches all four sources):
#   PNs  1–8:  100_BARS.exr   (source B starts at PN 5 → 4 frames)
#   PNs  9–16: SMPTE_BARS_001.exr
#   PNs 17–24: MULTIBURST.exr (gap at 21–22; resumes at PN 23)
#   PNs 25–32: TARTAN.exr
#   PNs 33–40: Y_CB_CR_RAMPS.exr
#
# Noise/dropout: moderate — noise_db 43.0, scale 8, seed 2002.
# Dropouts are disc-anchored (anchor: disc): keyed by picture number, so a
#   replayed range repeats the first play's dropouts as a real disc would.
# Forward skip: MultiBurst_PreGap_B (17–20) → MultiBurst_PostGap_B (start_value 23).

project:
  name: PalMDiscSimB
  version: "1.0"
  description: PAL-M disc simulation source B — seed 2002, start PN 5, forward skip at PN 20

cvbs_presets:
  video_standard_preset: PAL_M
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED

output:
  video_path: "{output}/videosynth_pal_m_discsim_B.cvbs"

line_injections:
  disc_type: CAV
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:

  # ---------------------------------------------------------------------------
  # PNs 5–8: 100% colour bars (source starts at PN 5; PNs 1–4 absent)
  # ---------------------------------------------------------------------------
  - name: Bars_B
    type: progressive
    source: "{bundled}/exr/720x486/100_BARS.exr"
    duration_frames: 4
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 8
        seed: 2002
        anchor: disc
      scratch:
        scale: 8
        seed: 2002
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 5
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 9–16: UK test card F
  # ---------------------------------------------------------------------------
  - name: Testcard_B
    type: progressive
    source: "{bundled}/exr/720x486/SMPTE_BARS_001.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 8
        seed: 2002
        anchor: disc
      scratch:
        scale: 8
        seed: 2002
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 17–20: multi-burst (player skips forward after PN 20)
  # ---------------------------------------------------------------------------
  - name: MultiBurst_PreGap_B
    type: progressive
    source: "{bundled}/exr/720x486/MULTIBURST.exr"
    duration_frames: 4
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 8
        seed: 2002
        anchor: disc
      scratch:
        scale: 8
        seed: 2002
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 23–24: multi-burst resumed after forward skip (gap of 2: PNs 21–22 absent)
  # ---------------------------------------------------------------------------
  - name: MultiBurst_PostGap_B
    type: progressive
    source: "{bundled}/exr/720x486/MULTIBURST.exr"
    duration_frames: 2
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 8
        seed: 2002
        anchor: disc
      scratch:
        scale: 8
        seed: 2002
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 23
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 25–32: tartan
  # ---------------------------------------------------------------------------
  - name: Tartan_B
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 8
        seed: 2002
        anchor: disc
      scratch:
        scale: 8
        seed: 2002
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 25
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 33–40: YCbCr ramps
  # ---------------------------------------------------------------------------
  - name: Ramps_B
    type: progressive
    source: "{bundled}/exr/720x486/Y_CB_CR_RAMPS.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 43.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 8
        seed: 2002
        anchor: disc
      scratch:
        scale: 8
        seed: 2002
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 33
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black
