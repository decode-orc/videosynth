# PAL-M Disc Simulation — Source D (seed 4004)
#
# Simulates a capture starting at PN 8 (PNs 1–7 not captured; stacker must
# rely solely on sources A, B, and C for those frames).
# Includes a backward skip: after PN 27 the player rewinds and replays PNs 25–32.
# Includes a forward skip: after PN 34 the player jumps to PN 37.
# PNs 35 and 36 are absent; Frame Map must detect the gap and pad.
# 34 frames total (3 backward-skip duplicates, 2-frame forward gap).
#
# Content layout (matches all four sources):
#   PNs  1–8:  100_BARS.exr   (source D starts at PN 8 → 1 frame)
#   PNs  9–16: SMPTE_BARS_001.exr
#   PNs 17–24: MULTIBURST.exr
#   PNs 25–32: TARTAN.exr     (backward skip: 25–27 first play, 25–32 replay)
#   PNs 33–40: Y_CB_CR_RAMPS.exr (forward skip: 33–34 played, gap 35–36, resume 37–40)
#
# Noise/dropout: heavy — noise_db 33.0, scale 14, seed 4004.
# Dropouts are disc-anchored (anchor: disc): keyed by picture number, so a
#   replayed range repeats the first play's dropouts as a real disc would.
# Backward skip: Tartan_PreSkip_D (25–27) → Tartan_Replay_D (noise_seed 9904).
# Forward skip: Ramps_PreGap_D (33–34) → Ramps_PostGap_D (start_value 37).

project:
  name: PalMDiscSimD
  version: "1.0"
  description: PAL-M disc simulation source D — seed 4004, start PN 8, backward + forward skips

cvbs_presets:
  video_standard_preset: PAL_M
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED

output:
  video_path: "{output}/videosynth_pal_m_discsim_D.cvbs"

line_injections:
  disc_type: CAV
  vits:
    - vits_type: virs
      target_lines: [19, 282]

sections:

  # ---------------------------------------------------------------------------
  # PN 8: 100% colour bars (source starts at PN 8; PNs 1–7 absent)
  # ---------------------------------------------------------------------------
  - name: Bars_D
    type: progressive
    source: "{bundled}/exr/720x486/100_BARS.exr"
    duration_frames: 1
    section_type: programme_area
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
      noise_seed: 4004
    dropouts:
      random:
        scale: 14
        seed: 4004
        anchor: disc
      scratch:
        scale: 14
        seed: 4004
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 8
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 9–16: UK test card F
  # ---------------------------------------------------------------------------
  - name: Testcard_D
    type: progressive
    source: "{bundled}/exr/720x486/SMPTE_BARS_001.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
      noise_seed: 4004
    dropouts:
      random:
        scale: 14
        seed: 4004
        anchor: disc
      scratch:
        scale: 14
        seed: 4004
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 9
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 17–24: multi-burst
  # ---------------------------------------------------------------------------
  - name: MultiBurst_D
    type: progressive
    source: "{bundled}/exr/720x486/MULTIBURST.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
      noise_seed: 4004
    dropouts:
      random:
        scale: 14
        seed: 4004
        anchor: disc
      scratch:
        scale: 14
        seed: 4004
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 17
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 25–27: tartan (first play; player rewinds after PN 27)
  # ---------------------------------------------------------------------------
  - name: Tartan_PreSkip_D
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 3
    section_type: programme_area
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
      noise_seed: 4004
    dropouts:
      random:
        scale: 14
        seed: 4004
        anchor: disc
      scratch:
        scale: 14
        seed: 4004
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 25
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 25–32: tartan replay (backward skip — same start_value, fresh noise)
  # ---------------------------------------------------------------------------
  - name: Tartan_Replay_D
    type: progressive
    source: "{bundled}/exr/720x486/TARTAN.exr"
    duration_frames: 8
    section_type: programme_area
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
      noise_seed: 9904
    dropouts:
      random:
        scale: 14
        seed: 4004
        anchor: disc
      scratch:
        scale: 14
        seed: 4004
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 25
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 33–34: YCbCr ramps (player skips forward after PN 34)
  # ---------------------------------------------------------------------------
  - name: Ramps_PreGap_D
    type: progressive
    source: "{bundled}/exr/720x486/Y_CB_CR_RAMPS.exr"
    duration_frames: 2
    section_type: programme_area
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
      noise_seed: 4004
    dropouts:
      random:
        scale: 14
        seed: 4004
        anchor: disc
      scratch:
        scale: 14
        seed: 4004
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 33
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black

  # ---------------------------------------------------------------------------
  # PNs 37–40: YCbCr ramps resumed after forward skip (gap of 2: PNs 35–36 absent)
  # ---------------------------------------------------------------------------
  - name: Ramps_PostGap_D
    type: progressive
    source: "{bundled}/exr/720x486/Y_CB_CR_RAMPS.exr"
    duration_frames: 4
    section_type: programme_area
    noise:
      noise_db: 33.0
      noise_spread_db: 4.0
      noise_seed: 4004
    dropouts:
      random:
        scale: 14
        seed: 4004
        anchor: disc
      scratch:
        scale: 14
        seed: 4004
        anchor: disc
    line_injections:
      - type: laserdisc
        codes:
          - code_type: picture_number
            start_value: 37
          - code_type: programme_status
            programme_status: "0x8DC001"
          - code_type: fm_picture_number
          - code_type: fm_white_flag
    osd:
      overlays:
        - text: "PN:{picture_number} HEX:{biphase_hex} PHASE:{phase_id}"
          x: 8
          y: 32
          scale: 1
          fg_luma: white
          bg_luma: black
