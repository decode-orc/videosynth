      area: programme_area
      codes:
        - code_type: picture_number
          start_value: 25
        - code_type: programme_status
          programme_status: "0x8DC000"
    noise:
      noise_db: 48.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 6
        seed: 2002
      scratch:
        scale: 6
        seed: 2002
  # ---------------------------------------------------------------------------
  # Section 5: fair source quality
