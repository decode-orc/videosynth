# PAL Stacking Test — Seed 2002
#
# 10 sections × 8 frames of tartan, progressing from clean (no degradation)
# to maximum noise and dropout. Designed for stacking algorithm validation.
#
# Noise ramp (noise_db): none → 58 → 53 → 48 → 43 → 38 → 33 → 28 → 24 → 20
# Dropout ramp (scale):  none →  2 →  4 →  6 →  8 → 10 → 12 → 14 → 17 → 20
# Picture numbers:          1 →  9 → 17 → 25 → 33 → 41 → 49 → 57 → 65 → 73
#
# All noise and dropout sections use seed 2002 as the deterministic base.
# Combine with pal_stacking_2002, pal_stacking_3003, pal_stacking_4004 to
# produce four independent captures with different degradation patterns.
#
# VITS: IBA/EBU uk-national on line 19 (IEC 60856 §9.1.3).
# Pilot burst: 3.75 MHz PAL laserdisc pilot carrier on all sync pulses.

project:
  name: PalStacking2002
  version: "1.0"
  description: PAL stacking test — clean to max noise+dropout, seed 2002

cvbs_presets:
  video_standard_preset: PAL
  sample_encoding_preset: CVBS_U10_4FSC
  signal_state_preset: STANDARD_STABLE_LOCKED

output:
  video_path: "{output}/videosynth_pal_stacking_2002.cvbs"

line_injections:
  vits:
    - vits_type: uk-national
      target_lines: [19]

laserdisc:
  disc_type: CAV
  pilot_burst: true

sections:

  # ---------------------------------------------------------------------------
  # Section 1: clean reference — no noise, no dropout
  # ---------------------------------------------------------------------------
  - name: CleanSource
    type: progressive
    source: "{bundled}/exr/720x576/TARTAN.exr"
    duration_frames: 8
    laserdisc:
      area: programme_area
      codes:
        - code_type: picture_number
          start_value: 1
        - code_type: programme_status
          programme_status: "0x8DC000"
  # ---------------------------------------------------------------------------
  # Section 2: near-quantisation noise, minimal dropout
  # ---------------------------------------------------------------------------
  - name: NearQuantisation
    type: progressive
    source: "{bundled}/exr/720x576/TARTAN.exr"
    duration_frames: 8
    laserdisc:
      area: programme_area
      codes:
        - code_type: picture_number
          start_value: 9
        - code_type: programme_status
          programme_status: "0x8DC000"
    noise:
      noise_db: 58.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 2
        seed: 2002
      scratch:
        scale: 2
        seed: 2002
  # ---------------------------------------------------------------------------
  # Section 3: excellent source quality
  # ---------------------------------------------------------------------------
  - name: ExcellentSource
    type: progressive
    source: "{bundled}/exr/720x576/TARTAN.exr"
    duration_frames: 8
    laserdisc:
      area: programme_area
      codes:
        - code_type: picture_number
          start_value: 17
        - code_type: programme_status
          programme_status: "0x8DC000"
    noise:
      noise_db: 53.0
      noise_spread_db: 4.0
      noise_seed: 2002
    dropouts:
      random:
        scale: 4
        seed: 2002
      scratch:
        scale: 4
        seed: 2002
  # ---------------------------------------------------------------------------
  # Section 4: good source quality
  # ---------------------------------------------------------------------------
  - name: GoodSource
    type: progressive
    source: "{bundled}/exr/720x576/TARTAN.exr"
    duration_frames: 8
